[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jevfire"
version = "0.1.0"
description = "One context. Many decisions. Parallel categorical inference through CUDA and vLLM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "kikoncuo"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "transformers>=4.57,<6",
  "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff==0.16.7"]

[project.urls]
Repository = "https://github.com/kikoncuo/jevfire"
Issues = "https://github.com/kikoncuo/jevfire/issues"

[tool.setuptools.packages.find]
include = ["jevfire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: opt-in checks against a running CUDA backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
